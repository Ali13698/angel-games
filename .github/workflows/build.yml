name: Build WASM Games

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          
      - name: Build Ludo WASM
        run: |
          cd ludo
          GOOS=wasip1 GOARCH=wasm go build -o game.wasm .
          
      - name: Commit and Push WASM
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-build Ludo WASM [skip ci]"
          file_pattern: "ludo/game.wasm"
