name: Build WASM Games

on:
  workflow_dispatch: # ✅ ربات فقط دستی اجرا می‌شود

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          
      - name: Build Ludo WASM
        run: |
          if [ -d "ludo" ]; then
            cd ludo
            GOOS=wasip1 GOARCH=wasm go build -o game.wasm .
          fi
          
      - name: Commit and Push WASM
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-build WASM [skip ci]"
          file_pattern: "ludo/game.wasm"
