name: Build WASM Games

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build Ludo WASM
        run: |
          if [ -d "ludo" ]; then
            cd ludo
            if [ ! -f "go.mod" ]; then go mod init ludo; fi
            GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o game.wasm .
          fi

      - name: Build TicTacToe WASM
        run: |
          if [ -d "tic-tac-toe" ]; then
            cd tic-tac-toe
            if [ ! -f "go.mod" ]; then go mod init tic-tac-toe; fi
            GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o game.wasm .
          fi

      - name: Commit and Push WASM
        uses: stanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-build WASM Games (c-shared) [skip ci]"
          file_pattern: "*/game.wasm"
