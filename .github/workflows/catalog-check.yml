name: Validate game catalog

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Install shared tooling
        run: npm install --ignore-scripts

      - name: Generate Protobuf bindings
        run: npm run protocol:generate

      - name: Test catalog scanner
        run: npm run test:catalog

      - name: Discover game manifests
        run: node scripts/catalog.mjs > catalog-source.json

      - name: Bundle SDK
        run: npx --yes esbuild@0.25.0 sdk/src/index.ts --bundle --format=esm --platform=browser --outfile=/tmp/angel-sdk.js

      - name: Build and test discovered games
        run: node scripts/build-games.mjs

      - name: Check Ludo distribution
        working-directory: ludo-light
        run: node scripts/check-dist.mjs

      - name: Verify release catalog
        run: node scripts/release-catalog.mjs

      - name: Retain build outputs
        uses: actions/upload-artifact@v4
        with:
          name: angel-games-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            catalog-release.json
            */game.json
            */dist/**
