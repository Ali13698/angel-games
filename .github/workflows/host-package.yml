name: Build Host Package

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Test host packager
        run: node --test scripts/package-host.test.mjs

      - name: Install shared tooling
        run: npm install --ignore-scripts

      - name: Generate protocol
        run: npm run protocol:generate

      - name: Test catalog
        run: npm run test:catalog

      - name: Build and test discovered games
        run: node scripts/build-games.mjs

      - name: Verify release catalog
        run: node scripts/release-catalog.mjs

      - name: Package games for host
        run: node scripts/package-host.mjs "${RUNNER_TEMP}/host-package"

      - name: Record source revision
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          printf '%s\n' "$SOURCE_SHA" > "${RUNNER_TEMP}/host-package/source-revision.txt"

      - name: Generate package checksums
        working-directory: ${{ runner.temp }}/host-package
        run: |
          find . -type f ! -name SHA256SUMS -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Archive host package
        run: |
          tar -C "${RUNNER_TEMP}/host-package" \
            -czf "${RUNNER_TEMP}/angel-host-package.tar.gz" .

      - name: Upload host package
        uses: actions/upload-artifact@v4
        with:
          name: angel-host-package-${{ github.sha }}
          path: ${{ runner.temp }}/angel-host-package.tar.gz
          if-no-files-found: error
          retention-days: 14
