name: Generate Unity Activation File
on:
  workflow_dispatch:

jobs:
  activation:
    name: Create .alf file
    runs-on: ubuntu-22.04
    steps:
      - name: Run Unity Docker and Force Copy .alf
        run: |
          mkdir -p ${{ github.workspace }}/unity-temp
          chmod -R 777 ${{ github.workspace }}/unity-temp
          docker run --rm \
            -v ${{ github.workspace }}/unity-temp:/data \
            unityci/editor:ubuntu-2022.3.10f1-base-3 \
            /bin/bash -c "unity-editor -batchmode -nographics -quit -createManualActivationFile -logFile /dev/stdout; find / -not -path '/proc/*' -not -path '/sys/*' -name 'Unity_v*.alf' -exec cp {} /data/ \;"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: ${{ github.workspace }}/unity-temp/Unity_v*.alf
