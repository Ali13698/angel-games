name: Generate Unity Activation File
on:
  workflow_dispatch:

jobs:
  activation:
    name: Create .alf file
    runs-on: ubuntu-latest
    steps:
      - name: Run Unity Docker to Create .alf
        run: |
          mkdir -p /tmp/unity
          docker run --rm -v /tmp/unity:/data unityci/editor:ubuntu-2022.3.10f1-base-3 \
            unity-editor -batchmode -nographics -quit -createManualActivationFile -logFile /dev/stdout

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: /tmp/unity/Unity_v*.alf
