name: Generate Unity Activation File
on:
  workflow_dispatch:

jobs:
  activation:
    name: Create .alf file
    runs-on: ubuntu-22.04
    steps:
      - name: Run Unity Docker and Copy .alf
        run: |
          mkdir -p ${{ github.workspace }}/unity-temp
          docker run --rm -v ${{ github.workspace }}/unity-temp:/data unityci/editor:ubuntu-2022.3.10f1-base-3 \
            /bin/bash -c "unity-editor -batchmode -nographics -quit -createManualActivationFile -logFile /dev/stdout && cp Unity_v*.alf /data/"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: ${{ github.workspace }}/unity-temp/Unity_v*.alf
