syntax = "proto3";

package angel;

option go_package = "github.com/angel/angel/internal/wire;wire";

// --- Client -> Server ---
message ClientMsg {
  string type = 1; // "join", "leave", "state", "roll", "move", "chat", "ping"
  string id = 2;
  string room_id = 3;
  int64 rev = 4;
  MovePayload move_payload = 5;
  ChatPayload chat_payload = 6;
}

message MovePayload {
  int32 token = 1;
}

message ChatPayload {
  string text = 1;
}

// --- Server -> Client ---
message ServerMsg {
  string type = 1; // "joined", "event", "pong", "error"
  string room_id = 2;
  string game_id = 3;
  int64 rev = 4;
  GameEvent event = 5;
  ErrorMsg error = 6;
}

message GameEvent {
  string event_id = 1;
  string stream_id = 2;
  int64 seq = 3;
  string type = 4;
  map<string, string> payload = 5; // برای سادگی فعلاً رشته، بعداً می‌تونیم Type-safe کنیم
}

message ErrorMsg {
  string code = 1;
  string error = 2;
}
