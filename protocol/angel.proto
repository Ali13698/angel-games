syntax = "proto3";

package angel;

option go_package = "github.com/angel/angel/internal/wire;wire";

message ClientMsg {
  string type = 1;
  string id = 2;
  string room_id = 3;
  int64 rev = 4;
  string payload_json = 5; 
}

message ServerMsg {
  string type = 1;
  string room_id = 2;
  string game_id = 3;
  int64 rev = 4;
  GameEvent event = 5;
  ErrorMsg error = 6;
  string state_json = 7;
  string from = 8;
  string payload_json = 9;
}

message GameEvent {
  string event_id = 1;
  string stream_id = 2;
  int64 seq = 3;
  string type = 4;
  string payload_json = 5; 
}

message ErrorMsg {
  string code = 1;
  string error = 2;
}
