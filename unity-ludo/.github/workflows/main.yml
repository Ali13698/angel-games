name: Angel WebGL
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: webgl-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install protoc and generate C#
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          bash tools/generate-proto.sh
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**', 'Protocol/**') }}
          restore-keys: Library-WebGL-
      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: auto
          targetPlatform: WebGL
          buildMethod: AngelEditor.WebGLBuild.Build
          allowDirtyBuild: true
      - name: Upload WebGL
        uses: actions/upload-artifact@v4
        with:
          name: Angel-WebGL
          path: build/WebGL
          if-no-files-found: error
          retention-days: 14
